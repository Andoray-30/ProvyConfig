name: home-node-dispatch
services:
  dispatch:
    build: .
    image: home-node-dispatch:20261012-v1
    platform: linux/amd64
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    tmpfs: [/tmp:size=32m,mode=1777]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  caddy:
    image: caddy:2.10.2
    profiles: [relay]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    tmpfs: [/tmp:size=16m,mode=1777]
    volumes:
      - ./data/caddy-config:/etc/caddy:ro
      - ./data/caddy:/data
      - ./data/caddy-settings:/config
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
